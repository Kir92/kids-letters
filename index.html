<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Иконка для вкладки браузера -->
    <link rel="icon" type="image/png" href="/icons/icon-256.png" />
    
    <!-- Основные мета-теги -->
    <title>Учим буквы с Умкой</title>
    <meta name="description" content="Зимняя игра для детей 3-4 лет. Учим буквы с полярным мишкой и собираем друзей!" />
    
    <!-- Настройки PWA для телефона -->
    <meta name="theme-color" content="#FFF8E7" />
    <link rel="apple-touch-icon" href="/icons/icon-256.png" />

    <!-- Open Graph / Соцсети -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Учим буквы с Умкой" />
    <meta property="og:description" content="Зимняя игра для детей 3-4 лет. Учим буквы с полярным мишкой и собираем друзей!" />
    <meta property="og:image" content="https://kir92.github.io/kids-letters/preview.png" />
    <meta property="og:url" content="https://kir92.github.io/kids-letters/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kir92.github.io/kids-letters/preview.png" />
  </head>
  <body>
    <!-- Слой для фона (нужен для мобильных) -->
    <div class="bg-layer"></div>
    
    <!-- Контейнер для снежинок -->
    <div id="snow-container"></div>
    
    <!-- Кнопка музыки -->
    <button id="global-music-btn" class="global-music-btn">🎵</button>
    
    <!-- Само приложение -->
    <div id="app"></div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
